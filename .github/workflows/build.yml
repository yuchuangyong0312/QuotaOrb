name: Windows build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Quota and installation checks
        run: dotnet run --project src/QuotaOrb.Tests -c Release
      - name: Storage and authorization checks with synthetic data
        run: dotnet run --project src/QuotaOrb.ServiceTests -c Release
      - name: Build Windows executable
        run: dotnet publish src/QuotaOrb/QuotaOrb.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o dist/QuotaOrb
